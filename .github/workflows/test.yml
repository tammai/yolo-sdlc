# Every change to the plugin: script tests, the scenario evals (risk rules + session hook as
# they ship to apps), the scaffold's own tests, and the manifests. The behaviour evals
# (evals/run-behavior.mjs) run Claude and cost usage, so they run on demand, not here.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: scaffold/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Plugin scripts (new-app, update-app)
        run: node --test "scripts/test/*.test.mjs"
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: Behaviour-eval gate (skills/agents unchanged since the last passing full run)
        run: node evals/fingerprint.mjs --check
      - name: Behaviour-eval graders compile and can match
        run: node evals/lint-scenarios.mjs
      - name: Scenario evals (every scenario must pass)
        run: node evals/run-scenarios.mjs
      - name: Scaffold risk-tier and deploy-guard tests
        working-directory: scaffold
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm test:risk
      - name: Manifests are valid JSON with matching names
        run: |
          node -e "
          const p=require('./.claude-plugin/plugin.json'), m=require('./.claude-plugin/marketplace.json');
          if (m.plugins[0].name !== p.name) throw new Error('plugin name mismatch');
          if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error('bad version');
          console.log(p.name, p.version, 'ok')"
      - name: The marketplace points at a tag that exists
        run: |
          ref=$(node -p "const s=require('./.claude-plugin/marketplace.json').plugins[0].source; typeof s === 'string' ? '' : (s.ref ?? '')")
          if [ -n "$ref" ]; then git ls-remote --exit-code --tags origin "refs/tags/$ref"; else echo "source is the repo itself"; fi
