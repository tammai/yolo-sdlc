<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1086" width="880" height="1086" role="img" aria-label="The yolo-sdlc loop, in the playbook's six stages. Plan: /yolo-sdlc:idea writes the problem in the person's words. Design: /yolo-sdlc:shape agrees 2 to 5 examples. Build: a technical plan is written; if the change is yellow or red, a plan review happens before any code, otherwise it goes straight to the implementer; the implementer writes checks first, then code; a fresh verifier audits the diff against the intent, and on FAIL the work goes back to the implementer, up to 3 rounds. Test: on PASS, /yolo-sdlc:check shows screenshots; if it is not quite right, it goes back to shape. Deploy: if the change is yellow or red, an engineer review of the local commit happens first; then the merge gate on GitHub checks the exact commit, and the deploy guard lets only main go live. Maintain: Report a problem on every page stores each report; an engineer runs /yolo-sdlc:triage, which turns new reports into draft intents, each the next idea, back at Plan.">
  <style>
    :root { --bg: #ffffff; --band: #f4f4f5; --box: #ffffff; --line: #d4d4d8; --text: #18181b; --muted: #52525b; --accent: #2563eb; --accent-soft: #dbeafe; --edge: #71717a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --band: #161b22; --box: #0d1117; --line: #30363d; --text: #e6edf3; --muted: #9da7b3; --accent: #58a6ff; --accent-soft: #10243e; --edge: #8b949e; }
    }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .stage { fill: var(--text); font: 700 14px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .caption { fill: var(--muted); font: 11px ui-monospace, 'SFMono-Regular', Consolas, monospace; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .title { fill: var(--text); font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .sub { fill: var(--muted); font: 11.5px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
    .loop { fill: none; stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .label { fill: var(--muted); font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .arrow { fill: var(--edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <path class="bg" d="M0,0 H880 V1086 H0 Z" />

  <!-- Stage bands, one per playbook stage, 12px apart (drawn as paths: containers, not boxes) -->
  <path class="band" d="M18,16 H862 A10,10 0 0 1 872,26 V96 A10,10 0 0 1 862,106 H18 A10,10 0 0 1 8,96 V26 A10,10 0 0 1 18,16 Z" />
  <path class="band" d="M18,118 H862 A10,10 0 0 1 872,128 V198 A10,10 0 0 1 862,208 H18 A10,10 0 0 1 8,198 V128 A10,10 0 0 1 18,118 Z" />
  <path class="band" d="M18,220 H862 A10,10 0 0 1 872,230 V574 A10,10 0 0 1 862,584 H18 A10,10 0 0 1 8,574 V230 A10,10 0 0 1 18,220 Z" />
  <path class="band" d="M18,596 H862 A10,10 0 0 1 872,606 V676 A10,10 0 0 1 862,686 H18 A10,10 0 0 1 8,676 V606 A10,10 0 0 1 18,596 Z" />
  <path class="band" d="M18,698 H862 A10,10 0 0 1 872,708 V958 A10,10 0 0 1 862,968 H18 A10,10 0 0 1 8,958 V708 A10,10 0 0 1 18,698 Z" />
  <path class="band" d="M18,980 H862 A10,10 0 0 1 872,990 V1060 A10,10 0 0 1 862,1070 H18 A10,10 0 0 1 8,1060 V990 A10,10 0 0 1 18,980 Z" />
  <text class="stage" x="24" y="44">1  Plan</text>
  <text class="stage" x="24" y="146">2  Design</text>
  <text class="stage" x="24" y="248">3  Build</text>
  <text class="caption" x="24" y="266">/yolo-sdlc:build</text>
  <text class="stage" x="24" y="624">4  Test</text>
  <text class="stage" x="24" y="726">5  Deploy</text>
  <text class="caption" x="24" y="744">/yolo-sdlc:ship</text>
  <text class="stage" x="24" y="1008">6  Maintain</text>

  <!-- Boxes -->
  <rect class="box-accent" x="300" y="33" width="260" height="56" rx="8" />
  <text class="title" x="430" y="56" text-anchor="middle">/yolo-sdlc:idea</text>
  <text class="sub" x="430" y="75" text-anchor="middle">the problem, in their words</text>
  <rect class="box-accent" x="300" y="135" width="260" height="56" rx="8" />
  <text class="title" x="430" y="158" text-anchor="middle">/yolo-sdlc:shape</text>
  <text class="sub" x="430" y="177" text-anchor="middle">agree 2–5 examples</text>
  <rect class="box" x="300" y="237" width="260" height="56" rx="8" />
  <text class="title" x="430" y="260" text-anchor="middle">technical plan</text>
  <text class="sub" x="430" y="279" text-anchor="middle">in the intent file</text>
  <polygon class="box" points="430,312 505,344 430,376 355,344" />
  <text class="title" x="430" y="349" text-anchor="middle">yellow / red?</text>
  <rect class="box" x="610" y="316" width="220" height="56" rx="8" />
  <text class="title" x="720" y="339" text-anchor="middle">plan review</text>
  <text class="sub" x="720" y="358" text-anchor="middle">before any code</text>
  <rect class="box" x="300" y="414" width="260" height="56" rx="8" />
  <text class="title" x="430" y="437" text-anchor="middle">implementer</text>
  <text class="sub" x="430" y="456" text-anchor="middle">checks first, then code</text>
  <rect class="box" x="300" y="504" width="260" height="56" rx="8" />
  <text class="title" x="430" y="527" text-anchor="middle">fresh verifier</text>
  <text class="sub" x="430" y="546" text-anchor="middle">audits the diff vs the intent</text>
  <rect class="box-accent" x="300" y="613" width="260" height="56" rx="8" />
  <text class="title" x="430" y="636" text-anchor="middle">/yolo-sdlc:check</text>
  <text class="sub" x="430" y="655" text-anchor="middle">screenshots: is this it?</text>
  <polygon class="box" points="430,716 505,748 430,780 355,748" />
  <text class="title" x="430" y="753" text-anchor="middle">yellow / red?</text>
  <rect class="box" x="610" y="720" width="220" height="56" rx="8" />
  <text class="title" x="720" y="743" text-anchor="middle">engineer review</text>
  <text class="sub" x="720" y="762" text-anchor="middle">of the local commit</text>
  <rect class="box" x="300" y="818" width="260" height="56" rx="8" />
  <text class="title" x="430" y="841" text-anchor="middle">merge gate</text>
  <text class="sub" x="430" y="860" text-anchor="middle">GitHub, exact commit</text>
  <rect class="box" x="300" y="898" width="260" height="56" rx="8" />
  <text class="title" x="430" y="921" text-anchor="middle">deploy guard</text>
  <text class="sub" x="430" y="940" text-anchor="middle">only main goes live</text>
  <rect class="box-accent" x="300" y="997" width="260" height="56" rx="8" />
  <text class="title" x="430" y="1020" text-anchor="middle">Report a problem</text>
  <text class="sub" x="430" y="1039" text-anchor="middle">on every page</text>
  <rect class="box" x="610" y="997" width="220" height="56" rx="8" />
  <text class="title" x="720" y="1020" text-anchor="middle">/yolo-sdlc:triage</text>
  <text class="sub" x="720" y="1039" text-anchor="middle">reports → draft intents</text>

  <!-- Forward edges, main column -->
  <path class="edge" d="M430,89 V135" marker-end="url(#arrow)" />
  <path class="edge" d="M430,191 V237" marker-end="url(#arrow)" />
  <path class="edge" d="M430,293 V312" marker-end="url(#arrow)" />
  <path class="edge" d="M430,376 V414" marker-end="url(#arrow)" />
  <text class="label" x="438" y="399">green</text>
  <path class="edge" d="M430,470 V504" marker-end="url(#arrow)" />
  <path class="edge" d="M430,560 V613" marker-end="url(#arrow)" />
  <text class="label" x="438" y="590.5">PASS</text>
  <path class="edge" d="M430,669 V716" marker-end="url(#arrow)" />
  <path class="edge" d="M430,780 V818" marker-end="url(#arrow)" />
  <text class="label" x="438" y="803">green</text>
  <path class="edge" d="M430,874 V898" marker-end="url(#arrow)" />
  <path class="edge" d="M430,954 V997" marker-end="url(#arrow)" />

  <!-- Build: yellow / red goes through the plan review -->
  <path class="edge" d="M505,344 H610" marker-end="url(#arrow)" />
  <text class="label" x="557.5" y="336" text-anchor="middle">yes</text>
  <path class="edge" d="M720,372 V442 H560" marker-end="url(#arrow)" />

  <!-- Build: FAIL goes back to the same implementer -->
  <path class="loop" d="M300,532 H265 V442 H300" marker-end="url(#arrow)" />
  <text class="label" x="258" y="484" text-anchor="end">FAIL</text>
  <text class="label" x="258" y="500" text-anchor="end">≤ 3 rounds</text>

  <!-- Deploy: yellow / red goes through the engineer review -->
  <path class="edge" d="M505,748 H610" marker-end="url(#arrow)" />
  <text class="label" x="557.5" y="740" text-anchor="middle">yes</text>
  <path class="edge" d="M720,776 V846 H560" marker-end="url(#arrow)" />

  <!-- Test: not quite goes back to shape -->
  <path class="loop" d="M300,641 H170 V163 H300" marker-end="url(#arrow)" />
  <text class="label" x="178" y="633">not quite</text>

  <!-- Maintain: reports are triaged into the next ideas -->
  <path class="edge" d="M560,1025 H610" marker-end="url(#arrow)" />
  <path class="loop" d="M830,1025 H858 V61 H560" marker-end="url(#arrow)" />
  <text class="label" x="850" y="543" text-anchor="end">next idea</text>
</svg>
