# Quality checks: typecheck and the risk-tier suite. The agreed examples (browser checks) run on
# the author's machine instead: /yolo-sdlc:build proves them, and /yolo-sdlc:check shows each one
# working with its screenshot before anything ships. Keeping them out of CI keeps it fast.
# Deploys are NOT done here. Cloudflare Workers Builds deploys from git (docs/SETUP.md),
# so no Cloudflare credentials ever live in GitHub.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:risk
